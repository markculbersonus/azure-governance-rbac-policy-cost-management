<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="t d"><title id="t">Azure Governance and Access Control Architecture</title><desc id="d">Microsoft Entra ID identity, Azure RBAC Reader permissions, resource group, Azure Policy VM SKU enforcement, denied deployment and compliant VM, and cost budget alerts.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081327"/><stop offset="1" stop-color="#15274c"/></linearGradient><linearGradient id="blue" x2="1"><stop stop-color="#1455d9"/><stop offset="1" stop-color="#12a9eb"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#6bcaff" stroke-width="1.7"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eaf3ff}.heading{font-size:34px;font-weight:750}.sub{font-size:17px;fill:#a9c1e6}.label{font-size:21px;font-weight:700}.body{font-size:16px;fill:#c4d6f3}.small{font-size:14px;fill:#99b8e0}.card{fill:#142b50;stroke:#3970ad;stroke-width:2}.line{fill:none;stroke:#6bcaff;stroke-width:3;marker-end:url(#arr)}.dash{fill:none;stroke:#a18bff;stroke-width:2;stroke-dasharray:9 7}</style></defs><rect width="1440" height="940" fill="url(#bg)"/><text x="72" y="76" class="heading">AZURE GOVERNANCE · POLICY & ACCESS CONTROL</text><text x="72" y="109" class="sub">Identity → authorization → preventive policy → deployment validation → financial visibility</text><rect x="58" y="145" width="1324" height="722" rx="28" fill="none" stroke="#41628d" stroke-width="2" stroke-dasharray="12 7"/><text x="88" y="179" class="small">AZURE SUBSCRIPTION 1 · GOVERNANCE BOUNDARY</text>
<rect x="95" y="225" width="340" height="150" rx="18" class="card"/><text x="122" y="265" class="label">Microsoft Entra ID</text><text x="122" y="298" class="body">Test identity</text><text x="122" y="328" class="small">Authentication and sign-in</text>
<rect x="520" y="225" width="350" height="150" rx="18" class="card"/><text x="548" y="265" class="label">Azure RBAC</text><text x="548" y="298" class="body">Reader role / least privilege</text><text x="548" y="328" class="small">Write attempt → AuthorizationFailed</text>
<rect x="965" y="225" width="360" height="150" rx="18" class="card"/><text x="993" y="265" class="label">Resource group</text><text x="993" y="298" class="body">governance resource group</text><text x="993" y="328" class="small">Scope for governance and budget</text>
<path d="M435 300 H510" class="line"/><path d="M870 300 H955" class="line"/>
<rect x="95" y="450" width="550" height="175" rx="18" class="card"/><text x="122" y="491" class="label">Azure Policy · Allowed VM SKUs</text><text x="122" y="526" class="body">Allowed: Standard_D2als_v6</text><text x="122" y="557" class="small">Deny effect at resource-group scope</text><text x="122" y="588" class="small">Disallowed SKU → RequestDisallowedByPolicy</text>
<rect x="745" y="450" width="580" height="175" rx="18" class="card"/><text x="772" y="491" class="label">Deployment outcome</text><text x="772" y="526" class="body">✕ Unapproved VM SKU: blocked</text><text x="772" y="558" class="body">✓ Approved D2als_v6 Linux VM: deployed</text><text x="772" y="589" class="small">Running state observed · guest agent not ready</text>
<path d="M1135 375 V411 H370 V440" class="line"/><path d="M645 537 H735" class="line"/>
<rect x="95" y="690" width="1230" height="120" rx="18" class="card"/><text x="124" y="734" class="label">Azure Cost Management · Monthly budget</text><text x="124" y="767" class="body">$50 / month · actual-cost email alerts at 80% ($40) and 100% ($50)</text><text x="124" y="792" class="small">Visibility and notification only — not an automatic spending cap</text><path d="M1135 625 V679" class="line"/><text x="88" y="905" class="small">Architecture is a conceptual governance diagram, not an exported Azure topology. Evidence images are redacted where feasible.</text></svg>